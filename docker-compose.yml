services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: digital_learning_resources
      MYSQL_USER: khim
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_ENABLED: ${AI_ENABLED:-false}

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: digital_learning_resources
      DB_USER: khim
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-replace-before-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AI_SERVICE_URL: http://ai-service:8000
      MAX_FILE_SIZE_MB: 20
    ports: ["5000:5000"]
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mysql_data:
  uploads_data:
